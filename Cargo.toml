[package]
name = "popineau_eu"
version = "0.1.0"
edition = "2024"

[dependencies]
jiff = "0.2.37"
rand = "0.10.3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
topcoat = { version = "0.9.0", features = ["asset", "font-fontsource", "icon-iconify", "tailwind"] }

[build-dependencies]
topcoat = { version = "0.9.0", default-features = false, features = ["icon-iconify", "tailwind"] }
