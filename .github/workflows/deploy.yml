name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-26.04
    container: rust:1.98-trixie
    env:
      CARGO_HOME: /github/home/.cargo
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: Mark repository as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install dependencies
        run: |
          cargo install --locked topcoat-cli

      - name: Build
        run: |
          cargo build --locked --release
          /github/home/.cargo/bin/topcoat asset bundle --release

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/popineau_eu dist/popineau_eu
          cp -r target/release/assets dist/assets

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: popineau_eu
          path: dist/*
          retention-days: 7

  docker:
    runs-on: ubuntu-26.04
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: popineau_eu
          path: dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ghcr.io/apognu/popineau.eu:${{ github.sha }}
          push: true
          provenance: mode=max

      - uses: softprops/action-gh-release@v2
        with:
          name: tip
          tag_name: tip
          make_latest: true
          target_commitish: ${{ github.sha }}
